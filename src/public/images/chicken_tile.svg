<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#bgGrad)"/>

  <!-- Speed Lines / Road -->
  <polygon points="40,300 260,300 200,160 100,160" fill="url(#roadGrad)" opacity="0.8"/>
  <line x1="150" y1="160" x2="150" y2="300" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12,10"/>

  <!-- Glowing Multiplier Sunburst -->
  <circle cx="150" cy="130" r="85" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Chicken Figure -->
  <g transform="translate(90, 60)" filter="url(#glow)">
    <!-- Shadow -->
    <ellipse cx="60" cy="130" rx="35" ry="10" fill="#000000" opacity="0.5"/>

    <!-- Feet -->
    <path d="M 45 110 L 38 126 M 45 110 L 45 128 M 45 110 L 52 126" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 75 110 L 68 126 M 75 110 L 75 128 M 75 110 L 82 126" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Tail Plumes -->
    <path d="M 25 70 C 10 50, 5 80, 22 90 Z" fill="url(#fireGrad)"/>
    <path d="M 20 60 C 5 40, 5 70, 20 75 Z" fill="url(#goldGrad)"/>

    <!-- Body -->
    <ellipse cx="60" cy="80" rx="36" ry="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Wing -->
    <path d="M 45 70 C 30 90, 65 105, 78 82 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

    <!-- Head -->
    <circle cx="80" cy="55" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Comb -->
    <path d="M 70 34 C 70 20, 78 20, 80 30 C 82 18, 90 18, 92 30 C 94 22, 100 24, 98 38 Z" fill="url(#fireGrad)"/>

    <!-- Wattle -->
    <path d="M 94 65 C 98 78, 88 80, 86 69 Z" fill="url(#fireGrad)"/>

    <!-- Beak -->
    <path d="M 96 52 L 116 58 L 96 66 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Eye -->
    <ellipse cx="88" cy="50" rx="5" ry="6" fill="#0f172a"/>
    <circle cx="90" cy="48" r="2" fill="#ffffff"/>
    <circle cx="78" cy="62" r="4" fill="#f87171" opacity="0.6"/>
  </g>

  <!-- Big Gold Multiplier Badge -->
  <g transform="translate(185, 40)" filter="url(#glow)">
    <rect width="85" height="32" rx="10" fill="url(#goldGrad)"/>
    <text x="42.5" y="22" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle">2450X</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(20, 235)">
    <rect width="260" height="48" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
    <text x="130" y="30" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      CHICKEN <tspan fill="#fbbf24">ROAD</tspan>
    </text>
  </g>
</svg>
